name: build-on-naavre-action
description: build-on-naavre-action

inputs:
  naavre_build_repo_url:
    description: URL to build the repo on NaaVRE build service.
    required: true

  naavre_build_token:
    description: Authentication token for the NaaVRE build service.
    required: true

runs:
  using: composite
  steps:
    - name: Set environment
      shell: bash
      env:
        INPUT_NAAVRE_BUILD_REPO_URL: ${{ inputs.naavre_build_repo_url }}
        INPUT_NAAVRE_BUILD_TOKEN: ${{ inputs.naavre_build_token }}
      # language=bash
      run: |
        #!/usr/bin/env bash
        # Derived from https://github.com/scikit-hep/pyhf/blob/v0.7.6/binder/trigger_binder.sh

        function trigger_naavre_build() {
          local URL="${1}"
          local TOKEN="${2}"

          curl -L --connect-timeout 10 --max-time 30 \
            -H "Authorization: ${TOKEN}" \
            "${URL}"
          curl_return=$?

          # Return code 28 is when the --max-time is reached
          if [ "${curl_return}" -eq 0 ] || [ "${curl_return}" -eq 28 ]; then
            if [[ "${curl_return}" -eq 28 ]]; then
              printf "\nBinder build started.\nCheck back soon.\n"
            fi
          else
            return "${curl_return}"
          fi

          return 0
        }

        trigger_naavre_build \
          "${INPUT_NAAVRE_BUILD_REPO_URL}" \
          "${INPUT_NAAVRE_BUILD_TOKEN}" \
          || exit 1
