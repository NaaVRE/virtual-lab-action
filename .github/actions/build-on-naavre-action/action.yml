name: build-on-naavre-action
description: build-on-naavre-action

inputs:
  naavre_build_repo_url:
    description: URL to build the repo on NaaVRE build service.
    required: true

  naavre_build_token:
    description: Authentication token for the NaaVRE build service.
    required: true

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install dependencies
      shell: bash
      run: |
        pip install 'httpx>=0.28.1'

    - name: Build on NaaVRE
      shell: python
      env:
        INPUT_NAAVRE_BUILD_REPO_URL: ${{ inputs.naavre_build_repo_url }}
        INPUT_NAAVRE_BUILD_TOKEN: ${{ inputs.naavre_build_token }}
      # language=python
      run: |
        import json
        import os
        import sys
        import httpx

        last_phase = None
        event_data = []

        def parse_event_phase(data):
            try:
                event = json.loads("\n".join(data))
            except json.JSONDecodeError:
                return None
            phase = event.get("phase") if isinstance(event, dict) else None
            return phase if isinstance(phase, str) else None

        try:
            with httpx.stream(
                "POST",
                os.environ["INPUT_NAAVRE_BUILD_REPO_URL"],
                headers={
                    "Authorization": f"Bearer {os.environ["INPUT_NAAVRE_BUILD_TOKEN"]}",
                    "Accept": "text/event-stream",
                },
                timeout=httpx.Timeout(None, connect=10),
            ) as response:
                response.raise_for_status()
                for line in response.iter_lines():
                    print(line, flush=True)
                    if not line:
                        if event_data:
                            last_phase = parse_event_phase(event_data)
                            event_data.clear()
                    elif line.startswith("data:"):
                        event_data.append(line[len("data:"):].strip())
                if event_data:
                    last_phase = parse_event_phase(event_data)
        except httpx.HTTPError as error:
            print(f"::error::NaaVRE build request failed: {error}", file=sys.stderr)
            sys.exit(1)

        if last_phase not in ("built", "launching", "ready"):
            print(
                f"::error::NaaVRE build stream ended with phase "
                f"{last_phase!r}; expected built, launching, or ready.",
                file=sys.stderr,
            )
            sys.exit(1)
