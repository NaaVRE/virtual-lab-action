name: show-link-to-binder-action
description: show-link-to-binder-action

inputs:
  binder_launch_repo_url:
    description: URL to launch the repo on the Binder instance.
    required: true

  message_kind:
    description: >
      Kind of message to display:
        - tests_warning: the virtual lab could not be tested automatically (default)
        - tests_info: the virtual lab has been tested automatically
    required: false
    default: tests_warning

runs:
  using: composite
  steps:

    - name: Show link to run on binder
      uses: actions/github-script@v7
      env:
        INPUT_BINDER_LAUNCH_REPO_URL: ${{ inputs.binder_launch_repo_url }}
        INPUT_MESSAGE_KIND: ${{ inputs.message_kind }}
      with:
        # language=javascript
        script: |
          const MARKER = '<!-- virtual-lab-action-binder-comment -->';
          const BRANCH = context.ref.replace(/^refs\/heads\//, '');
          const INPUT_BINDER_LAUNCH_REPO_URL = process.env.INPUT_BINDER_LAUNCH_REPO_URL;
          const INPUT_MESSAGE_KIND = process.env.INPUT_MESSAGE_KIND;
          const LINK = `[${INPUT_BINDER_LAUNCH_REPO_URL}](${INPUT_BINDER_LAUNCH_REPO_URL})`;
          const RUN_URL =
            `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` +
            `/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
          const MESSAGES = {
            tests_warning:
              '> [!WARNING]\n' +
              '> This virtual lab could not be tested automatically, because no test files were found.\n' +
              `> * You can manually test this version of the virtual lab on NaaVRE: ${LINK}\n` +
              '> * You can enable automatic testing by adding files to `binder/tests` or `.binder/tests`. Supported extensions: `.py`, `.R`, `.sh` and `.ipynb`.',
            tests_info:
              '> [!NOTE]\n' +
              '> This virtual lab has been tested automatically.\n' +
              `> * You can view the CI testing logs: [${RUN_URL}](${RUN_URL})\n` +
              `> * You can do additional manual testing of this version of the virtual lab on NaaVRE: ${LINK}`,
          };
          if (!(INPUT_MESSAGE_KIND in MESSAGES)) {
            core.setFailed(`Unknown message_kind '${INPUT_MESSAGE_KIND}'. Valid values: ${Object.keys(MESSAGES).join(', ')}.`);
            return;
          }
          const MESSAGE = MESSAGES[INPUT_MESSAGE_KIND];
          const body = `${MARKER}\n${MESSAGE}`;

          // Add the message to the action summary
          core.notice(MESSAGE);
          await core.summary.addRaw(MESSAGE).write();

          // If the commit belongs to a PR, add the message as comment
          if (!['pull_request', 'push'].includes(context.eventName)) return;

          let prNumber;

          if (context.eventName === 'pull_request') {
            prNumber = context.payload.pull_request.number;

          } else {
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${BRANCH}`,
            });

            if (pullRequests.length === 0) {
              core.info(`No open PR found for branch '${BRANCH}'. Skipping PR comment.`);
              return;
            }

            // Use the latest PR if there are multiple
            prNumber = pullRequests[0].number;
          }

          core.info(`Commenting on PR #${prNumber}`);

          // Find an existing comment
          const comments = await github.paginate(
            github.rest.issues.listComments,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            }
          );

          const existing = comments.find(c => c.body.startsWith(MARKER));

          // Create or update comment
          if (existing) {
            core.info(`Updating existing comment ${existing.id}`);
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            core.info('Creating new comment');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
          }
