name: NaaVRE Virtual Lab Action
description: >
  Test or deploy a NaaVRE virtual lab repository

branding:
  icon: 'package'
  color: 'green'

inputs:
  action:
    description: >
      Action to perform:
        - build_test_on_ci: build and test on the repo's CI runner
        - build_on_naavre: build on NaaVRE
        - show_link_to_binder: show a link to run on binder
        - auto: choose automatically (default)
    required: false
    default: auto

  binder_url:
    description: URL of the Binder instance.
    required: false
    default: https://binder-poc.naavre.net/binderhub

  naavre_build_url:
    description: URL of the NaaVRE build service.
    required: false
    default: https://binder-poc.naavre.net/naavre-environment-service/build

  naavre_build_token:
    description: >
      Authentication token for the NaaVRE build service (set to `\$\{\{ secrets.NAAVRE_BUILD_TOKEN \}\}`)
    required: true

  registry_password:
    description: >
      Password for ghcr.io, used for caching docker images (set it to secrets.GITHUB_TOKEN in the workflow call).
      If empty, caching will be disabled.
    required: false

runs:
  using: composite
  steps:
    - name: Set current action data
      id: set-action-data
      run: |
        echo "action_repository=$ACTION_REPOSITORY" >> $GITHUB_OUTPUT
        echo "action_ref=$ACTION_REF" >> $GITHUB_OUTPUT
      shell: bash
      env:
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}

    - name: Checkout action repository
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.set-action-data.outputs.action_repository }}
        ref: ${{ steps.set-action-data.outputs.action_ref }}
        path: _self

    - name: Configure action
      id: configure
      shell: bash
      env:
        INPUT_ACTION: ${{ inputs.action }}
        INPUT_BINDER_URL: ${{ inputs.binder_url }}
        INPUT_NAAVRE_BUILD_URL: ${{ inputs.naavre_build_url }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF: ${{ github.ref }}
      run: |
        set -euo pipefail

        action=""

        if [[ "${INPUT_ACTION}" == "build_test_on_ci" ]]; then
          action="build_test_on_ci"

        elif [[ "${INPUT_ACTION}" == "build_on_naavre" ]]; then
          action="build_on_naavre"

        elif [[ "${INPUT_ACTION}" == "show_link_to_binder" ]]; then
          action="show_link_to_binder"

        elif [[ "${INPUT_ACTION}" == "auto" ]]; then
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            action="build_on_naavre"
          elif [[ -d "binder/tests" || -d ".binder/tests" ]]; then
            action="build_test_on_ci"
          else
            action="show_link_to_binder"
          fi

        else
          echo "::error::Unknown action value '${INPUT_ACTION}'. Valid values: auto, build_test_on_ci, build_on_naavre, or show_link_to_binder."
          exit 1

        fi

        echo "action=${action}" >> "$GITHUB_OUTPUT"
        echo "Resolved action: ${action}"

        binder_launch_repo_url="${INPUT_BINDER_URL}/v2/gh/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"
        naavre_build_repo_url="${INPUT_NAAVRE_BUILD_URL}/gh/${GITHUB_REPOSITORY}/latest"

        echo "binder_launch_repo_url=${binder_launch_repo_url}" >> "$GITHUB_OUTPUT"
        echo "naavre_build_repo_url=${naavre_build_repo_url}" >> "$GITHUB_OUTPUT"
        echo "Binder launch URL: ${binder_launch_repo_url}"
        echo "NaaVRE build URL: ${naavre_build_repo_url}"

    - name: Build and test in CI pipeline
      if: steps.configure.outputs.action == 'build_test_on_ci'
      uses: ./_self/.github/actions/build-test-on-ci-action
      with:
        registry_password: ${{ inputs.registry_password }}

    - name: Build on NaaVRE
      if: steps.configure.outputs.action == 'build_on_naavre'
      uses: ./_self/.github/actions/build-on-naavre-action
      with:
        naavre_build_repo_url: ${{ steps.configure.outputs.naavre_build_repo_url }}
        naavre_build_token: ${{ inputs.naavre_build_token }}

    - name: Show link to run on binder
      if: steps.configure.outputs.action == 'show_link_to_binder'
      uses: ./_self/.github/actions/show-link-to-binder-action
      with:
        binder_launch_repo_url: ${{ steps.configure.outputs.binder_launch_repo_url }}
